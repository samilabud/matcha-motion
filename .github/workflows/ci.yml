name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run tokens:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:hardcoded
      - run: npx playwright install --with-deps chromium
      - run: npm run test:stories

  playwright:
    runs-on: ubuntu-latest
    # Same image locally and in CI keeps screenshot baselines stable.
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npx playwright test
        env: { CI: "true", HOME: /root }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: test-results }

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx lhci autorun
